name: Build macOS App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'auth-system/**'
      - 'package.json'
      - '.github/workflows/build-macos-app.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'auth-system/package-lock.json'
    
    - name: Get version
      id: version
      run: |
        VERSION=$(cat auth-system/package.json | grep '"version"' | head -1 | sed 's/.*: "\(.*\)".*/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
    
    - name: Install dependencies
      run: |
        cd auth-system
        npm install --production=false
    
    - name: Run linting
      continue-on-error: true
      run: |
        cd auth-system
        npm run lint || true
    
    - name: Run tests
      continue-on-error: true
      run: |
        cd auth-system
        npm run test-integration || true
    
    - name: Install Electron builder
      run: |
        npm install --save-dev electron electron-builder electron-notarize
      working-directory: auth-system
    
    - name: Create build configuration
      run: |
        cat > auth-system/electron-builder.yml << 'EOF'
        appId: com.remoteai.guardian
        productName: RemoteAI Guardian
        directories:
          output: build
          buildResources: assets
        
        mac:
          target:
            - dmg
            - zip
            - tar.gz
          category: public.app-category.productivity
          hardenedRuntime: true
          gatekeeperAssess: false
          entitlements: entitlements.mac.plist
          entitlementsInherit: entitlements.mac.plist
        
        dmg:
          contents:
            - x: 110
              y: 150
              type: file
              path: RemoteAIGuardian.app
            - x: 240
              y: 150
              type: link
              path: /Applications
        
        afterSign: notarize.js
        EOF
    
    - name: Create entitlements file
      run: |
        cat > auth-system/entitlements.mac.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-executable-page-protection</key>
            <true/>
        </dict>
        </plist>
        EOF
    
    - name: Build macOS App (DMG)
      env:
        APPLEID: ${{ secrets.APPLE_ID }}
        APPLEIDPASS: ${{ secrets.APPLE_ID_PASSWORD }}
        ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
      run: |
        cd auth-system
        npm run build:mac || npx electron-builder --mac dmg --publish never
    
    - name: Generate checksums
      run: |
        cd auth-system/build
        shasum -a 256 *.dmg > checksums.txt || true
        shasum -a 256 *.zip >> checksums.txt || true
        cat checksums.txt
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v3
      with:
        name: RemoteAIGuardian-${{ steps.version.outputs.VERSION }}-macos.dmg
        path: auth-system/build/*.dmg
        retention-days: 30
    
    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v3
      with:
        name: RemoteAIGuardian-${{ steps.version.outputs.VERSION }}-macos.zip
        path: auth-system/build/*.zip
        retention-days: 30
    
    - name: Upload checksums
      uses: actions/upload-artifact@v3
      with:
        name: RemoteAIGuardian-${{ steps.version.outputs.VERSION }}-checksums
        path: auth-system/build/checksums.txt
        retention-days: 30
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          auth-system/build/*.dmg
          auth-system/build/*.zip
          auth-system/build/checksums.txt
        draft: false
        prerelease: false
        body: |
          # macOS App Release v${{ steps.version.outputs.VERSION }}
          
          **Built**: ${{ steps.version.outputs.TIMESTAMP }}
          **Platform**: macOS
          **Node**: 20.x
          
          ## Installation
          1. Download the DMG file
          2. Double-click to open
          3. Drag RemoteAI Guardian to Applications folder
          4. Launch from Applications
          
          ## System Requirements
          - macOS 10.13+
          - Intel or Apple Silicon
          - 100MB disk space
          
          ## Changes
          See commit history for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload to TestFlight (optional)
      if: ${{ inputs.build_type == 'production' }}
      continue-on-error: true
      run: |
        # 這裡可以添加 TestFlight 上傳邏輯
        echo "TestFlight upload would go here"
    
    - name: Notify Slack on success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            text: '✅ macOS build succeeded',
            attachments: [{
              color: 'good',
              text: `Version: ${{ steps.version.outputs.VERSION }}\nBuild: ${{ steps.version.outputs.TIMESTAMP }}`
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
    
    - name: Notify Slack on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            text: '❌ macOS build failed',
            attachments: [{
              color: 'danger',
              text: `Version: ${{ steps.version.outputs.VERSION }}\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
