name: Build iOS App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'iOS/**'
      - '.github/workflows/build-ios-app.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  build:
    name: Build iOS App (${{ inputs.build_type || 'development' }})
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest
    
    - name: Get version
      id: version
      run: |
        VERSION=$(cat iOS/RemoteAIGuardian/Info.plist | grep -A 1 "CFBundleShortVersionString" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
        BUILD=$(cat iOS/RemoteAIGuardian/Info.plist | grep -A 1 "CFBundleVersion" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "BUILD=$BUILD" >> $GITHUB_OUTPUT
    
    - name: Setup provisioning profiles (if needed)
      if: ${{ inputs.build_type == 'production' }}
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        # 這裡可以添加你的證書和配置檔案
    
    - name: Build iOS App for Simulator
      run: |
        cd iOS
        xcodebuild \
          -scheme RemoteAIGuardian \
          -configuration Release \
          -sdk iphonesimulator \
          -derivedDataPath build \
          build \
          | xcpretty -c
    
    - name: Build iOS App for Device
      run: |
        cd iOS
        xcodebuild \
          -scheme RemoteAIGuardian \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          build \
          | xcpretty -c
    
    - name: Archive for App Store (production only)
      if: ${{ inputs.build_type == 'production' }}
      run: |
        cd iOS
        xcodebuild \
          -scheme RemoteAIGuardian \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          archive \
          -archivePath build/RemoteAIGuardian.xcarchive \
          | xcpretty -c
    
    - name: Export IPA (production only)
      if: ${{ inputs.build_type == 'production' }}
      run: |
        cd iOS
        xcodebuild \
          -exportArchive \
          -archivePath build/RemoteAIGuardian.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath build/ipa \
          | xcpretty -c
    
    - name: Upload Simulator Build
      if: ${{ inputs.build_type != 'production' }}
      uses: actions/upload-artifact@v3
      with:
        name: RemoteAIGuardian-Simulator-${{ steps.version.outputs.VERSION }}
        path: iOS/build/Release-iphonesimulator/
        retention-days: 7
    
    - name: Upload Device Build
      uses: actions/upload-artifact@v3
      with:
        name: RemoteAIGuardian-Device-${{ steps.version.outputs.VERSION }}
        path: iOS/build/Release-iphoneos/
        retention-days: 7
    
    - name: Upload IPA
      if: ${{ inputs.build_type == 'production' }}
      uses: actions/upload-artifact@v3
      with:
        name: RemoteAIGuardian-${{ steps.version.outputs.VERSION }}.ipa
        path: iOS/build/ipa/RemoteAIGuardian.ipa
        retention-days: 30
    
    - name: Create Release (production only)
      if: ${{ inputs.build_type == 'production' && startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v1
      with:
        files: iOS/build/ipa/RemoteAIGuardian.ipa
        draft: false
        prerelease: false
        body: |
          # iOS App Release v${{ steps.version.outputs.VERSION }}
          
          **Build**: ${{ steps.version.outputs.BUILD }}
          **Platform**: iOS
          **Built**: ${{ github.event.head_commit.timestamp }}
          
          ## Installation
          1. Download the IPA file
          2. Use Xcode or Apple Configurator 2 to install
          3. Or submit to TestFlight/App Store
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ iOS build failed"
        echo "Version: ${{ steps.version.outputs.VERSION }}"
        echo "Build: ${{ steps.version.outputs.BUILD }}"
